<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LifeLog</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <meta
    name="theme-color"
    content="#181b20"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >
</head>


<body>

  <main class="app">


    <!-- ヘッダー -->
    <header class="header">

      <div>

        <p class="sub-title">
          DAILY TRACKER
        </p>

        <h1>
          今日の予定
        </h1>

      </div>


      <div class="date-navigation">

        <button
          id="prevDateButton"
          class="date-button"
        >
          ←
        </button>


        <button
          id="todayButton"
          class="today-button"
        >
          今日
        </button>


        <span
          id="todayDate"
          class="date"
        ></span>


        <button
          id="nextDateButton"
          class="date-button"
        >
          →
        </button>

      </div>

    </header>



    <!-- 予定一覧 -->
    <section class="card">

      <div
        id="scheduleList"
        class="schedule-list"
      ></div>


      <button
        id="addButton"
        class="add-button"
      >
        ＋ 予定を追加
      </button>

    </section>



    <!-- 今日の実績 -->
    <section class="card result-card">

      <h2>
        今日の実績
      </h2>


      <!-- 起床 -->
      <div class="result-row result-time-row">

        <span>
          今日の起床
        </span>


        <input
          type="time"
          id="wakeTimeInput"
          class="result-time-input"
        >

      </div>


      <!-- 就寝 -->
      <div class="result-row result-time-row">

        <span>
          今日の就寝
        </span>


        <input
          type="time"
          id="sleepTimeInput"
          class="result-time-input"
        >

      </div>


      <!-- 実績一覧 -->
      <div
        id="activityResults"
        class="activity-results"
      ></div>


      <!-- 実績追加 -->
      <button
        id="addActivityButton"
        class="add-activity-button"
      >
        ＋ 実績を追加
      </button>


      <!-- 達成数 -->
      <div class="result-row achievement">

        <span>
          達成
        </span>


        <strong id="achievementResult">
          0 / 0
        </strong>

      </div>

    </section>



    <!-- 今日の支出 -->
    <section class="card expense-card">

      <h2>
        今日の支出
      </h2>


      <div
        id="expenseResults"
        class="expense-results"
      ></div>


      <div class="expense-total-row">

        <span>
          今日の合計
        </span>


        <strong
          id="dailyExpenseTotal"
          class="expense-total"
        >
          0円
        </strong>

      </div>


      <button
        id="addExpenseButton"
        class="add-expense-button"
      >
        ＋ 支出を追加
      </button>

    </section>



    <!-- 週間まとめ -->
    <section class="card weekly-card">

      <div class="weekly-header">

        <h2>
          週間まとめ
        </h2>


        <span
          id="weeklyDateRange"
          class="weekly-date-range"
        ></span>

      </div>


      <div
        id="weeklyActivitySummary"
        class="weekly-activity-summary"
      ></div>
      
      <div class="weekly-expense-section">
      
        <div class="weekly-expense-total-row">

          <span>
            週間支出
          </span>

          <strong id="weeklyExpenseTotal">
            0円
          </strong>

        </div>


        <div
    
        id="weeklyExpenseSummary"
    
        class="weekly-expense-summary"
  
        ></div>

      </div>

    </section>



    <!-- データ管理 -->
    <section class="card backup-card">

      <h2>
        データ管理
      </h2>


      <p class="backup-description">
        予定と実績をJSONファイルとして保存できます。
      </p>


      <div class="backup-buttons">

        <button
          id="exportBackupButton"
          class="backup-button"
        >
          バックアップ
        </button>


        <button
          id="importBackupButton"
          class="backup-button"
        >
          復元
        </button>

      </div>


      <input
        type="file"
        id="backupFileInput"
        accept=".json,application/json"
        hidden
      >

    </section>


  </main>


  <!-- LifeLog -->
  <script src="script.js"></script>


  <!-- PWA -->
  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(error => {

              console.error(
                "Service Worker登録失敗:",
                error
              );

            });

        }
      );

    }

  </script>

</body>

</html>
