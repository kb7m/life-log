<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LifeLog</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <meta
    name="theme-color"
    content="#181b20"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

</head>


<body>


  <main class="app">


    <!-- ================================
         ヘッダー
    ================================= -->

    <header class="header">


      <div class="app-title-area">

        <h1>
          LifeLog
        </h1>

        <span
          id="monthProgress"
          class="month-progress"
        ></span>

      </div>



      
      <div class="date-control-area">

  
        <div class="date-mode-switch">

    
          <button
      
          id="dayModeButton"
  
          class="date-mode-button active"
   
          type="button"
  
          >
   
  
          日
    
 
        </button>

  
        <button
   
        id="monthModeButton"
    
    
        class="date-mode-button"
   
        type="button"
 
        >
 
        月
 
 
      </button>

 
    </div>



    <div class="date-navigation">

    <button
      id="prevDateButton"
      class="date-button"
      type="button"
    >
      ←
    </button>


    <button
      id="todayButton"
      class="today-button"
      type="button"
    >
      今日
    </button>


   
    <label class="date-picker-wrapper">

    
      <span
    
      id="todayDate"
    
      class="date"
    
        ></span>

   
        <input
    
        id="datePickerInput"
    
        class="date-picker-input"
    
        type="date"
   
        aria-label="日付を選択"
   
        >

   
      </label>


   
      <button
   
      id="nextDateButton"
   
      class="date-button"
   
      type="button"

      >
 
      →
 
    </button>


 
  </div>



</div>


    </header>




    <!-- ================================
         予定タブ
    ================================= -->

    <div
      id="scheduleTabPanel"
      class="tab-panel active"
    >


      <!-- ================================
           今日の予定
      ================================= -->

      <section class="card schedule-card">


        <div
          id="scheduleList"
          class="schedule-list"
        ></div>


        <button
          id="addButton"
          class="add-button"
          type="button"
        >
          ＋ 予定を追加
        </button>


      </section>




      <!-- ================================
           週間まとめ
      ================================= -->

      <section class="card weekly-card">


        <div class="weekly-header">


          <h2>
            週間まとめ
          </h2>


          <span
            id="weeklyDateRange"
            class="weekly-date-range"
          ></span>


        </div>



        <!-- 週間実績 -->

        <div
          id="weeklyActivitySummary"
          class="weekly-activity-summary"
        ></div>



        <!-- 週間支出 -->

        <div class="weekly-expense-section">


          <div class="weekly-expense-total-row">


            <span>
              週間支出
            </span>


            <strong id="weeklyExpenseTotal">
              0円
            </strong>


          </div>



          <div
            id="weeklyExpenseSummary"
            class="weekly-expense-summary"
          ></div>


        </div>


      </section>




      <!-- ================================
           月間まとめ
      ================================= -->

      <section class="card monthly-card">


        <div class="monthly-header">


          <h2>
            月間まとめ
          </h2>


          <span
            id="monthlyDateRange"
            class="monthly-date-range"
          ></span>


        </div>



        <!-- 月間実績 -->

        <div
          id="monthlyActivitySummary"
          class="monthly-activity-summary"
        ></div>



        <!-- 月間支出 -->

        <div class="monthly-expense-section">


          <div class="monthly-expense-total-row">


            <span>
              月間支出
            </span>


            <strong id="monthlyExpenseTotal">
              0円
            </strong>


          </div>



          <div
            id="monthlyExpenseSummary"
            class="monthly-expense-summary"
          ></div>


        </div>


      </section>


    </div>




    <!-- ================================
         実績タブ
    ================================= -->

    <div
      id="resultTabPanel"
      class="tab-panel"
    >


      <!-- ================================
           今日の実績
      ================================= -->

      <section class="card result-card">


        <h2>
          今日の実績
        </h2>



        <!-- 起床 -->

        <div class="result-row result-time-row">


          <span>
            今日の起床
          </span>


          <input
            type="time"
            id="wakeTimeInput"
            class="result-time-input"
          >


        </div>



        <!-- 就寝 -->

        <div class="result-row result-time-row">


          <span>
            今日の就寝
          </span>


          <input
            type="time"
            id="sleepTimeInput"
            class="result-time-input"
          >


        </div>



        <!-- 実績一覧 -->

        <div
          id="activityResults"
          class="activity-results"
        ></div>



        <!-- 実績追加 -->

        <button
          id="addActivityButton"
          class="add-activity-button"
          type="button"
        >
          ＋ 実績を追加
        </button>



        <!-- 達成数 -->

        <div class="result-row achievement">


          <span>
            達成
          </span>


          <strong id="achievementResult">
            0 / 0
          </strong>


        </div>


      </section>




      <!-- ================================
           今日の支出
      ================================= -->

      <section class="card expense-card">


        <h2>
          今日の支出
        </h2>



        <div
          id="expenseResults"
          class="expense-results"
        ></div>



        <div class="expense-total-row">


          <span>
            今日の合計
          </span>


          <strong
            id="dailyExpenseTotal"
            class="expense-total"
          >
            0円
          </strong>


        </div>



        <button
          id="addExpenseButton"
          class="add-expense-button"
          type="button"
        >
          ＋ 支出を追加
        </button>


      </section>




      <!-- ================================
           今日の一言
      ================================= -->

      <section class="card note-card">


        <h2>
          今日の一言
        </h2>


        <input
          type="text"
          id="dailyNoteInput"
          class="daily-note-input"
          placeholder="今日どうだった？"
          maxlength="100"
        >


      </section>




      <!-- ================================
           今日の写真
      ================================= -->

      <section class="card photo-card">


        <h2>
          今日の写真
        </h2>



        <div
          id="dailyPhotoPreview"
          class="daily-photo-preview"
        >

          <p class="photo-empty">
            まだ写真がありません
          </p>

        </div>



        <input
          type="file"
          id="dailyPhotoInput"
          accept="image/*"
          hidden
        >



        <div class="photo-buttons">


          <button
            id="selectPhotoButton"
            class="photo-button"
            type="button"
          >
            ＋ 写真を選ぶ
          </button>


          <button
            id="deletePhotoButton"
            class="photo-button photo-delete-button"
            type="button"
            hidden
          >
            写真を削除
          </button>


        </div>


      </section>




      <!-- ================================
           データ管理
      ================================= -->

      <section class="card backup-card">


        <h2>
          データ管理
        </h2>



        <p class="backup-description">
          予定・実績・支出・一言メモ・写真を保存できます。
        </p>



        <div class="backup-buttons">


          <button
            id="exportBackupButton"
            class="backup-button"
            type="button"
          >
            バックアップ
          </button>


          <button
            id="importBackupButton"
            class="backup-button"
            type="button"
          >
            復元
          </button>


        </div>



        <input
          type="file"
          id="backupFileInput"
          accept=".json,application/json"
          hidden
        >


      </section>


    </div>


  </main>




  <!-- ================================
       下部タブ
  ================================= -->

  <nav class="bottom-tabs">


    <button
      id="scheduleTabButton"
      class="bottom-tab active"
      type="button"
    >
      予定
    </button>


    <button
      id="resultTabButton"
      class="bottom-tab"
      type="button"
    >
      実績
    </button>


  </nav>




  <!-- ================================
       LifeLog本体
  ================================= -->

  <script src="script.js"></script>




  <!-- ================================
       予定 / 実績 タブ切り替え
  ================================= -->

  <script>


    const scheduleTabButton =
      document.getElementById(
        "scheduleTabButton"
      );


    const resultTabButton =
      document.getElementById(
        "resultTabButton"
      );


    const scheduleTabPanel =
      document.getElementById(
        "scheduleTabPanel"
      );


    const resultTabPanel =
      document.getElementById(
        "resultTabPanel"
      );



    function switchMainTab(
      tab
    ) {


      const isSchedule =
        tab === "schedule";


      scheduleTabPanel
        .classList.toggle(
          "active",
          isSchedule
        );


      resultTabPanel
        .classList.toggle(
          "active",
          !isSchedule
        );


      scheduleTabButton
        .classList.toggle(
          "active",
          isSchedule
        );


      resultTabButton
        .classList.toggle(
          "active",
          !isSchedule
        );


    }



    scheduleTabButton
      .addEventListener(
        "click",
        () => {

          switchMainTab(
            "schedule"
          );

        }
      );



    resultTabButton
      .addEventListener(
        "click",
        () => {

          switchMainTab(
            "result"
          );

        }
      );


  </script>




  <!-- ================================
       PWA
  ================================= -->

  <script>


    if (
      "serviceWorker" in navigator
    ) {


      window.addEventListener(
        "load",
        () => {


          navigator.serviceWorker
            .register(
              "./sw.js"
            )
            .catch(
              error => {


                console.error(
                  "Service Worker登録失敗:",
                  error
                );


              }
            );


        }
      );


    }


  </script>


</body>

</html>
